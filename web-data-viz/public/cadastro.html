<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/login.css">
    <title>Document</title>
</head>
<body>
    <section id="login">
        <div id="login_titulo">

            <div id="voltar">

                <h3>NSOQC</h3>
                <a id="x_voltar" href="./index.html">X</a>
            </div>
        
            <p class="texto_vermelho">QUE BOM TER VOCÊ DE VOLTA</p>
            <h2>CRIE SUA CONTA</h2>
            <p class="subtexto">Seu perfil é necessário para participar do ranking oficial.</p>

        </div>

        <div class="inp_campos">

            <label for="inp_nome">Nome</label>
            <input type="text" id="inp_nome" class="campo" placeholder="Cleitinho">
            <span></span>
        </div>
        
        <div class="inp_campos">

            <label for="inp_email">E-mail</label>
            <input type="text" id="inp_email" class="campo" placeholder="seuemail@gmail.com">
            <span></span>
        </div>
        
        <div class="inp_campos">

            <label for="inp_senha">Senha</label>
            <input  type="text" id="inp_senha" class="campo" placeholder="A1234567!">
            <span></span>
        
        </div>

        <!-- Mensagem de erro/sucesso devolvida pela API -->
        <p id="msg_erro" style="display:none; color:#bb2e2e; font-weight:bold; margin-top:0.8pc; font-size:0.9pc;"></p>

        <button id="bt_entrar" onclick="cadastrar()">Cadastrar</button>
    
        <div id="rodape">
            <p>Ja tem uma conta?<a id="link" href="./login.html"> Entrar</a> </p>
        </div>

    </section>

    <script>
        // Mostra ou esconde a mensagem de retorno da API
        function mostrarMensagem(texto, cor) {
            var msg = document.getElementById("msg_erro");
            if (texto) {
                msg.textContent = texto;
                msg.style.color = cor || "#bb2e2e";
                msg.style.display = "block";
            } else {
                msg.textContent = "";
                msg.style.display = "none";
            }
        }

        function cadastrar() {
            var nomeVar = document.getElementById("inp_nome").value.trim();
            var emailVar = document.getElementById("inp_email").value.trim();
            var senhaVar = document.getElementById("inp_senha").value;
            var botao = document.getElementById("bt_entrar");

            // Verificando se há algum campo em branco
            if (nomeVar == "" || emailVar == "" || senhaVar == "") {
                mostrarMensagem("Preencha nome, e-mail e senha.");
                return false;
            }

            if (emailVar.indexOf("@") == -1) {
                mostrarMensagem("E-mail inválido! Use o formato nome@provedor.com.");
                return false;
            }

            mostrarMensagem("");
            botao.disabled = true;
            botao.textContent = "Cadastrando...";

            // Enviando os dados para a API (rota POST /usuarios/cadastrar)
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar
                }),
            })
                .then(function (resposta) {
                    console.log("Status do cadastro:", resposta.status);

                    if (resposta.ok) {
                        mostrarMensagem("Cadastro realizado com sucesso! Redirecionando para o login...", "#2e7d32");

                        setTimeout(function () {
                            window.location = "./login.html";
                        }, 1500);
                        return null;
                    }

                    // A API devolveu erro (400 campos, 409 e-mail repetido, 500 banco)
                    return resposta.text().then(function (texto) {
                        var mensagem = texto;

                        // Respostas em JSON (ex.: e-mail já cadastrado) chegam como texto
                        try {
                            var json = JSON.parse(texto);
                            mensagem = json.mensagem || texto;
                        } catch (e) {
                            // não é JSON, usa o texto cru mesmo
                        }

                        mostrarMensagem(mensagem || "Houve um erro ao tentar realizar o cadastro!");
                        botao.disabled = false;
                        botao.textContent = "Cadastrar";
                    });
                })
                .catch(function (erro) {
                    console.log(erro);
                    mostrarMensagem("Não foi possível falar com a API. Verifique se ela está rodando.");
                    botao.disabled = false;
                    botao.textContent = "Cadastrar";
                });

            return false;
        }
    </script>
</body>
</html>
